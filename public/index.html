<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>오늘의 할 일</h1>

    <div class="todo-input">
      <input type="text" class="todo-input-field" placeholder="할 일을 입력하세요" >
      <button class="add-btn">추가</button>
    </div>

    <ol class="todo-list"></ol>
  </div>
  <script src="script.js"></script>
</body>
</html>
